version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: revenue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-revenue_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-revenue_secret}
      POSTGRES_DB: ${DB_NAME:-revenue_tracker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-revenue_user} -d ${DB_NAME:-revenue_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

